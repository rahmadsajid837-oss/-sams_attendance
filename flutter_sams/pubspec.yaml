name: sams_attendance
description: "Smart Attendance Management System (SAMS) - Production Flutter Application with Firebase and Hive Offline Sync"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_messaging: ^14.9.0
  google_sign_in: ^6.2.1

  # Local Offline Database (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management & DI
  provider: ^6.1.2

  # Connectivity & Network Monitoring
  connectivity_plus: ^6.0.3

  # Secure Storage
  flutter_secure_storage: ^9.2.1

  # UI & Date Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
