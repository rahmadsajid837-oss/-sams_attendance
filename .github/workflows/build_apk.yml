name: Build SAMS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter_sams
        run: flutter pub get

      - name: Run Unit Tests
        working-directory: ./flutter_sams
        run: flutter test

      - name: Build Release APK
        working-directory: ./flutter_sams
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMS-Attendance-Release-APK
          path: flutter_sams/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
